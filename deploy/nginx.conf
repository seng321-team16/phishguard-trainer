# nginx configuration of the web container (copied to /etc/nginx/nginx.conf by web/Dockerfile).
#
# - Serves the Vite build from /usr/share/nginx/html with a single-page-app fallback.
# - Proxies /api/ to the API container, so the browser only ever talks to one origin
#   and the API port is never published.
# - Runs unprivileged: no "user" directive, port 8080, pid and temp files under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Writable locations for a non-root nginx (also works with a read-only root filesystem).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers. They are set once here; the locations below must not use
        # add_header themselves, because that would drop the inherited ones.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        # API: same origin for the browser, forwarded to the "api" service on the Compose network.
        # The name is resolved by Docker's embedded DNS at request time (variable + resolver),
        # so nginx starts even when the API is not up yet and follows it after a restart.
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            client_max_body_size 100k;
        }

        # Container health check (does not depend on the API).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite emits content-hashed file names under /assets/, safe to cache for a long time.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # Single-page app: unknown paths fall back to index.html, which is never cached.
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
