<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCR-02 Register – PhishGuard Trainer (prototype)</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      /* Base ----------------------------------------------------------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-family-base);
        font-size: var(--font-size-md);
        line-height: var(--line-height-base);
        color: var(--color-text);
        background: var(--color-bg);
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol,
      dl,
      dd,
      fieldset,
      legend {
        margin: 0;
        padding: 0;
      }
      ul,
      ol {
        list-style: none;
      }
      fieldset {
        border: 0;
        min-width: 0;
      }
      a {
        color: var(--color-link);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: var(--focus-ring-width) solid var(--color-focus);
        outline-offset: var(--focus-ring-offset);
      }
      .header :focus-visible {
        outline-color: var(--color-neutral-0);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .skip-link {
        position: absolute;
        left: var(--space-2);
        top: -10rem;
        z-index: 30;
        padding: var(--space-2) var(--space-4);
        background: var(--color-surface);
        color: var(--color-link);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
      }
      .skip-link:focus {
        top: var(--space-2);
      }
      .icon {
        width: 1.25rem;
        height: 1.25rem;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-lg {
        width: 2rem;
        height: 2rem;
      }
      .mono {
        font-family: var(--font-family-mono);
        font-size: var(--font-size-sm);
        overflow-wrap: anywhere;
      }
      .muted {
        color: var(--color-text-muted);
      }
      .small {
        font-size: var(--font-size-sm);
      }
      .stack {
        display: grid;
        gap: var(--space-4);
      }
      .stack-sm {
        display: grid;
        gap: var(--space-2);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
      }
      .row-end {
        justify-content: flex-end;
      }
      .row-between {
        justify-content: space-between;
      }

      /* Page header ------------------------------------------------------ */
      .header {
        background: var(--color-primary-800);
        color: var(--color-text-on-primary);
      }
      .header-inner {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: var(--space-2) var(--space-3);
        padding: var(--space-2) var(--space-4);
        max-width: calc(var(--size-content) + 2 * var(--space-5));
        margin: 0 auto;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--color-text-on-primary);
        text-decoration: none;
        font-weight: var(--font-weight-bold);
        font-size: var(--font-size-md);
      }
      .brand {
        grid-row: 1;
        grid-column: 1;
      }
      .account {
        grid-row: 1;
        grid-column: 2;
      }
      .nav {
        grid-row: 2;
        grid-column: 1 / -1;
      }
      .nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
      }
      .nav a {
        display: inline-flex;
        align-items: center;
        min-height: var(--size-control);
        padding: 0 var(--space-3);
        border-radius: var(--radius-md);
        color: var(--color-text-on-primary);
        text-decoration: none;
      }
      .nav a[aria-current='page'] {
        background: var(--color-primary-700);
        font-weight: var(--font-weight-bold);
        box-shadow: inset 0 -3px 0 var(--color-neutral-0);
      }
      .account {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .account-name {
        display: none;
      }
      .role-badge {
        padding: 0 var(--space-2);
        border: 1px solid var(--color-neutral-0);
        border-radius: var(--radius-pill);
        font-size: var(--font-size-sm);
      }
      body:not(:target) .admin-only {
        display: none;
      }
      body:target .learner-only {
        display: none;
      }

      /* Layout ----------------------------------------------------------- */
      .main {
        max-width: calc(var(--size-content) + 2 * var(--space-5));
        margin: 0 auto;
        padding: var(--space-5) var(--space-4) var(--space-7);
        display: grid;
        gap: var(--space-5);
      }
      .main-narrow {
        max-width: 50rem;
      }
      .page-title {
        font-size: var(--font-size-xl);
        line-height: var(--line-height-tight);
      }
      .page-intro {
        color: var(--color-text-muted);
        margin-top: var(--space-1);
      }
      .grid-2,
      .grid-3 {
        display: grid;
        gap: var(--space-4);
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: var(--space-4);
      }
      .card-title {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-bold);
        line-height: var(--line-height-tight);
      }
      legend.card-title {
        padding: 0 var(--space-2);
      }

      /* Buttons ---------------------------------------------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        min-height: var(--size-control);
        padding: 0 var(--space-4);
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        font-weight: var(--font-weight-medium);
        text-decoration: none;
        cursor: pointer;
        background: none;
      }
      .btn-primary {
        background: var(--color-primary-600);
        color: var(--color-text-on-primary);
      }
      .btn-primary:hover {
        background: var(--color-primary-700);
      }
      .btn-secondary {
        background: var(--color-surface);
        border-color: var(--color-border-strong);
        color: var(--color-link);
      }
      .btn-secondary:hover {
        background: var(--color-primary-50);
      }
      .btn-danger {
        background: var(--color-danger-600);
        color: var(--color-text-on-danger);
      }
      .btn-danger:hover {
        background: var(--color-danger-700);
      }
      .btn-danger-outline {
        background: var(--color-surface);
        border-color: var(--color-danger-600);
        color: var(--color-danger-700);
      }
      .btn-on-dark {
        border-color: var(--color-neutral-0);
        color: var(--color-text-on-primary);
      }
      .btn-small {
        min-height: 2.25rem;
        padding: 0 var(--space-3);
        font-size: var(--font-size-sm);
      }
      .btn-block {
        width: 100%;
      }
      .btn[aria-disabled='true'] {
        background: var(--color-surface-muted);
        border-color: var(--color-border);
        color: var(--color-text-muted);
        cursor: not-allowed;
      }

      /* Form controls ------------------------------------------------------ */
      .field {
        display: grid;
        gap: var(--space-1);
      }
      .label,
      .legend {
        font-weight: var(--font-weight-medium);
      }
      .optional {
        font-weight: var(--font-weight-regular);
        color: var(--color-text-muted);
      }
      .hint {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
      .input {
        width: 100%;
        min-height: var(--size-control);
        padding: var(--space-2) var(--space-3);
        background: var(--color-surface);
        color: var(--color-text);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-md);
      }
      textarea.input {
        resize: vertical;
        line-height: var(--line-height-base);
      }
      .input[aria-invalid='true'] {
        border: 2px solid var(--color-danger-600);
      }
      .error-text {
        display: flex;
        align-items: flex-start;
        gap: var(--space-1);
        font-size: var(--font-size-sm);
        color: var(--color-danger-700);
        font-weight: var(--font-weight-medium);
      }
      .error-text .icon {
        width: 1.125rem;
        height: 1.125rem;
        margin-top: 1px;
      }
      .field-foot {
        display: flex;
        justify-content: space-between;
        gap: var(--space-3);
      }
      .counter {
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        margin-left: auto;
      }
      .check {
        display: flex;
        align-items: flex-start;
        gap: var(--space-2);
        min-height: var(--size-control);
        padding: var(--space-2) 0;
        cursor: pointer;
      }
      .check input,
      .choice input {
        width: 1.25rem;
        height: 1.25rem;
        margin: 2px 0 0;
        flex: none;
        accent-color: var(--color-primary-600);
      }
      .check-desc {
        display: block;
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-3);
        margin-top: var(--space-2);
      }
      .choice {
        display: flex;
        align-items: flex-start;
        gap: var(--space-2);
        padding: var(--space-3);
        cursor: pointer;
        background: var(--color-surface);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-md);
      }
      .choice:has(input:checked) {
        background: var(--color-primary-50);
        border-color: var(--color-primary-600);
        box-shadow: inset 0 0 0 1px var(--color-primary-600);
      }
      .choice:has(input:focus-visible) {
        outline: var(--focus-ring-width) solid var(--color-focus);
        outline-offset: var(--focus-ring-offset);
      }
      .choice-title {
        display: block;
        font-weight: var(--font-weight-bold);
      }
      .choice-hint {
        display: block;
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
      .help summary {
        color: var(--color-link);
        cursor: pointer;
        font-size: var(--font-size-sm);
        min-height: 1.5rem;
      }
      .help dl {
        margin-top: var(--space-2);
        display: grid;
        gap: var(--space-2);
        font-size: var(--font-size-sm);
      }
      .help dt {
        font-weight: var(--font-weight-medium);
      }
      .help dd {
        color: var(--color-text-muted);
      }

      /* Notices, badges, chips --------------------------------------------- */
      .notice {
        display: flex;
        align-items: flex-start;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        border-left: 4px solid;
      }
      .notice .icon {
        margin-top: 2px;
      }
      .notice-title {
        font-weight: var(--font-weight-bold);
      }
      .notice-success {
        background: var(--color-success-50);
        border-color: var(--color-success-600);
      }
      .notice-success .icon,
      .notice-success .notice-title {
        color: var(--color-success-700);
      }
      .notice-danger {
        background: var(--color-danger-50);
        border-color: var(--color-danger-600);
      }
      .notice-danger .icon,
      .notice-danger .notice-title {
        color: var(--color-danger-700);
      }
      .notice-warning {
        background: var(--color-warning-50);
        border-color: var(--color-warning-600);
      }
      .notice-warning .icon,
      .notice-warning .notice-title {
        color: var(--color-warning-800);
      }
      .notice-info {
        background: var(--color-primary-50);
        border-color: var(--color-primary-600);
      }
      .notice-info .icon,
      .notice-info .notice-title {
        color: var(--color-primary-700);
      }
      .badge,
      .tag {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        padding: 0 var(--space-2);
        border-radius: var(--radius-pill);
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        white-space: nowrap;
      }
      .badge .icon,
      .tag .icon {
        width: 1rem;
        height: 1rem;
      }
      .badge-phishing,
      .tag-missed {
        background: var(--color-danger-50);
        color: var(--color-danger-700);
      }
      .badge-legitimate,
      .tag-spotted {
        background: var(--color-success-50);
        color: var(--color-success-700);
      }
      .badge-neutral {
        background: var(--color-surface-muted);
        color: var(--color-text);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        padding: 0 var(--space-3);
        min-height: 1.75rem;
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-pill);
        background: var(--color-surface);
        font-size: var(--font-size-sm);
      }

      /* Email (inbox view) ------------------------------------------------- */
      .progress-text {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
      }
      .progress {
        height: 0.5rem;
        margin-top: var(--space-1);
        background: var(--color-surface-muted);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-pill);
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: var(--color-primary-600);
      }
      .training-grid {
        display: grid;
        gap: var(--space-4);
      }
      .card.email {
        padding: 0;
        overflow: hidden;
      }
      .email-head {
        padding: var(--space-4);
        border-bottom: 1px solid var(--color-border);
        display: grid;
        gap: var(--space-3);
      }
      .email-subject {
        font-size: var(--font-size-lg);
        line-height: var(--line-height-tight);
      }
      .email-from {
        display: flex;
        gap: var(--space-3);
        align-items: flex-start;
      }
      .avatar {
        width: 2.5rem;
        height: 2.5rem;
        flex: none;
        border-radius: var(--radius-pill);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--color-primary-50);
        color: var(--color-primary-700);
        font-weight: var(--font-weight-bold);
      }
      .email-meta {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      .email-meta div {
        display: grid;
      }
      .email-meta dt {
        color: var(--color-text-muted);
        font-size: var(--font-size-sm);
      }
      .email-meta dd {
        min-width: 0;
      }
      .sender-name {
        font-weight: var(--font-weight-bold);
      }
      .email-scroll {
        padding: var(--space-4);
        display: grid;
        gap: var(--space-4);
        align-content: start;
      }
      .email-body {
        display: grid;
        gap: var(--space-3);
        max-width: 38rem;
      }
      .email-links {
        background: var(--color-surface-muted);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3);
      }
      .email-links h3 {
        font-size: var(--font-size-sm);
      }
      .email-links li {
        margin-top: var(--space-2);
        display: grid;
        gap: 2px;
      }
      .link-label {
        text-decoration: underline;
      }
      .link-target-caption {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }

      /* Feedback panel ------------------------------------------------------ */
      .side {
        display: grid;
        gap: var(--space-3);
        align-content: start;
      }
      .result {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3);
        border-radius: var(--radius-md);
        border-left: 4px solid;
      }
      .result-correct {
        background: var(--color-success-50);
        border-color: var(--color-success-600);
      }
      .result-correct .icon,
      .result-correct .result-title {
        color: var(--color-success-700);
      }
      .result-wrong {
        background: var(--color-danger-50);
        border-color: var(--color-danger-600);
      }
      .result-wrong .icon,
      .result-wrong .result-title {
        color: var(--color-danger-700);
      }
      .result-title {
        font-size: var(--font-size-lg);
        line-height: var(--line-height-tight);
      }
      .result-points {
        margin-left: auto;
        text-align: right;
        font-size: var(--font-size-sm);
        white-space: nowrap;
      }
      .result-points strong {
        display: block;
        font-size: var(--font-size-lg);
        line-height: var(--line-height-tight);
      }
      .answer-line {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1) var(--space-5);
        font-size: var(--font-size-sm);
      }
      .answer-line div {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .answer-line dt {
        color: var(--color-text-muted);
      }
      .section-title {
        font-size: var(--font-size-md);
        line-height: var(--line-height-tight);
      }
      .flags {
        display: grid;
        gap: var(--space-2);
      }
      .flag-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-1) var(--space-2);
      }
      .flag-name {
        font-weight: var(--font-weight-medium);
      }
      .flag-desc,
      .explanation {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
      .explanation {
        color: var(--color-text);
      }

      /* Summary, statistics -------------------------------------------------- */
      .score {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-4) var(--space-5);
      }
      .score-figure {
        font-size: var(--font-size-3xl);
        font-weight: var(--font-weight-bold);
        line-height: 1;
      }
      .score-unit {
        font-size: var(--font-size-lg);
        color: var(--color-text-muted);
        font-weight: var(--font-weight-regular);
      }
      .stat-label {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
      .stat-value {
        font-size: var(--font-size-3xl);
        font-weight: var(--font-weight-bold);
        line-height: 1.1;
      }
      .wrong-list li {
        padding: var(--space-3) 0;
        border-top: 1px solid var(--color-border);
        display: grid;
        gap: var(--space-1);
      }
      .wrong-list li:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .rate {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .rate-track {
        width: 6rem;
        height: 0.5rem;
        background: var(--color-surface-muted);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-pill);
        overflow: hidden;
      }
      .rate-bar {
        height: 100%;
        background: var(--color-primary-600);
      }
      .trend {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        font-weight: var(--font-weight-medium);
      }
      .trend-up {
        color: var(--color-success-700);
      }
      .trend-down {
        color: var(--color-danger-700);
      }

      /* Data table ------------------------------------------------------------ */
      .card.table-card {
        padding: 0;
        overflow: hidden;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
      }
      .table caption {
        text-align: left;
        padding: var(--space-3) var(--space-4);
        font-weight: var(--font-weight-bold);
      }
      .table th {
        text-align: left;
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-bold);
        background: var(--color-surface-muted);
        padding: var(--space-2) var(--space-3);
      }
      .table td {
        padding: var(--space-3);
        border-top: 1px solid var(--color-border);
        vertical-align: middle;
      }
      .table-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        border-top: 1px solid var(--color-border);
      }
      .nowrap {
        white-space: nowrap;
      }
      .row-nowrap {
        flex-wrap: nowrap;
      }
      .cell-sub {
        display: block;
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        overflow-wrap: anywhere;
      }
      /* Phone: a wide table becomes one block per row, each cell with its column name. */
      .table-stack thead {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .table-stack tr {
        display: block;
        padding: var(--space-3) var(--space-4);
        border-top: 1px solid var(--color-border);
      }
      .table-stack td {
        display: flex;
        gap: var(--space-3);
        padding: var(--space-1) 0;
        border: 0;
      }
      .table-stack td::before {
        content: attr(data-label);
        flex: none;
        width: 5.5rem;
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
      .table-stack td > * {
        min-width: 0;
      }

      /* Toast, modal ------------------------------------------------------------ */
      .toast {
        position: fixed;
        right: var(--space-4);
        bottom: var(--space-4);
        left: var(--space-4);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-4);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-left: 4px solid var(--color-success-600);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-lg);
      }
      .toast .icon {
        color: var(--color-success-700);
      }
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: var(--space-4);
        background: var(--color-scrim);
      }
      .scrim:target {
        display: flex;
      }
      body:has(.scrim:target) .toast {
        display: none;
      }
      .dialog {
        width: 100%;
        max-width: 28rem;
        display: grid;
        gap: var(--space-4);
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        padding: var(--space-5);
      }
      .dialog-title {
        font-size: var(--font-size-lg);
        line-height: var(--line-height-tight);
      }

      /* States (SCR-11) ----------------------------------------------------------- */
      .state {
        display: grid;
        justify-items: center;
        gap: var(--space-3);
        text-align: center;
        padding: var(--space-6) var(--space-4);
      }
      .state-icon {
        width: 4rem;
        height: 4rem;
        border-radius: var(--radius-pill);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--color-surface-muted);
        color: var(--color-text-muted);
      }
      .state-title {
        font-size: var(--font-size-lg);
        line-height: var(--line-height-tight);
      }
      .state p {
        color: var(--color-text-muted);
        max-width: 30rem;
      }
      .spec-caption {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
        border-bottom: 1px dashed var(--color-border-strong);
        padding-bottom: var(--space-1);
      }

      /* Login and registration ------------------------------------------------------ */
      .auth {
        min-height: 100vh;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: var(--space-5);
        padding: var(--space-5) var(--space-4);
      }
      .auth-brand {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        font-weight: var(--font-weight-bold);
        font-size: var(--font-size-xl);
        color: var(--color-primary-700);
      }
      .auth-brand .icon {
        width: 2rem;
        height: 2rem;
      }
      .auth-card {
        width: 100%;
        max-width: var(--size-form);
        display: grid;
        gap: var(--space-4);
        padding: var(--space-5);
      }
      .auth-foot {
        text-align: center;
      }

      /* Laptop (from 768 px) --------------------------------------------------------- */
      @media (min-width: 48rem) {
        .header-inner {
          display: flex;
          height: var(--size-header);
          padding: 0 var(--space-5);
          gap: var(--space-5);
        }
        .brand {
          font-size: var(--font-size-lg);
        }
        .nav a {
          min-height: 2.25rem;
        }
        .account {
          margin-left: auto;
          gap: var(--space-3);
        }
        .account-name {
          display: inline;
          font-size: var(--font-size-sm);
        }
        .main {
          padding: var(--space-6) var(--space-5) var(--space-7);
        }
        .page-title {
          font-size: var(--font-size-2xl);
        }
        .card {
          padding: var(--space-5);
        }
        .grid-2 {
          grid-template-columns: 3fr 2fr;
          align-items: start;
        }
        .grid-3 {
          grid-template-columns: repeat(3, 1fr);
        }
        .cols-2 {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: var(--space-4);
          align-items: start;
        }
        .check {
          min-height: 2rem;
          padding: var(--space-1) 0;
        }
        .table th,
        .table td {
          padding-left: var(--space-4);
          padding-right: var(--space-4);
        }
        .table-stack thead {
          position: static;
          width: auto;
          height: auto;
          clip: auto;
        }
        .table-stack tr {
          display: table-row;
          padding: 0;
        }
        .table-stack td {
          display: table-cell;
          padding: var(--space-3) var(--space-4);
          border-top: 1px solid var(--color-border);
        }
        .table-stack td::before {
          content: none;
        }
        .toast {
          left: auto;
          top: calc(var(--size-header) + var(--space-4));
          bottom: auto;
          right: var(--space-5);
          max-width: 24rem;
        }

        /* Training: the whole screen fits the window, so the feedback never needs scrolling (NFR-09). */
        .training {
          height: 100vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
        .training .main {
          flex: 1;
          min-height: 0;
          width: 100%;
          grid-template-rows: auto minmax(0, 1fr);
          gap: var(--space-3);
          padding: var(--space-4) var(--space-5);
        }
        .training-grid {
          min-height: 0;
          grid-template-columns: minmax(0, 1fr) 30rem;
          gap: var(--space-5);
        }
        .email {
          min-height: 0;
          display: flex;
          flex-direction: column;
        }
        .email-head {
          padding: var(--space-4) var(--space-5);
        }
        .email-meta div {
          grid-template-columns: 4.5rem minmax(0, 1fr);
          align-items: baseline;
        }
        .email-subject {
          font-size: var(--font-size-xl);
        }
        .email-scroll {
          flex: 1;
          min-height: 0;
          overflow: auto;
          padding: var(--space-4) var(--space-5);
        }
        .side {
          min-height: 0;
          overflow: auto;
          padding: var(--space-4);
        }
      }
    </style>
  </head>
  <body>
    <main class="auth">
      <div class="auth-brand">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z" />
          <path d="M8.5 12l2.5 2.5 4.5-5" /></svg
        ><span>PhishGuard Trainer</span>
      </div>
      <section class="card auth-card" aria-labelledby="title">
        <h1 id="title" class="page-title">Create account</h1>
        <form class="stack" action="SCR-01-login.html" novalidate>
          <div class="field">
            <label class="label" for="username">Username</label>
            <input
              class="input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              value="selin.kaya"
              aria-describedby="username-hint"
              required
            />
            <p class="hint" id="username-hint">
              3–32 characters: letters, digits, dot, dash or underscore.
            </p>
          </div>
          <div class="field">
            <label class="label" for="email">Email address</label>
            <input
              class="input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              value="selin.kaya@example.com"
              required
            />
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input
              class="input"
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              value="shortpass"
              aria-invalid="true"
              aria-describedby="password-error password-hint"
              required
            />
            <p class="error-text" id="password-error">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 4l9 16H3z" />
                <path d="M12 10v4.5M12 17v.5" /></svg
              ><span>Use at least 12 characters. You entered 9.</span>
            </p>
            <p class="hint" id="password-hint">12–128 characters. A long phrase works well.</p>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>
        <p class="auth-foot">Already have an account? <a href="SCR-01-login.html">Log in</a></p>
      </section>
      <p class="small muted">A training simulator. No real email is ever sent.</p>
    </main>
  </body>
</html>
